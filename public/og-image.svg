<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="url(#accentGradient)" opacity="0.08"/>
  <circle cx="1150" cy="80" r="60" fill="#22d3ee" opacity="0.05"/>
  
  <!-- Grid pattern -->
  <g stroke="#22d3ee" stroke-width="0.5" opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="630" x2="1200" y2="0"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  
  <!-- Main content area -->
  <g transform="translate(600, 315)">
    <!-- Logo/Icon -->
    <g transform="translate(-40, -140)">
      <!-- Trending up icon -->
      <path d="M40 80 L40 40 L80 0" stroke="url(#accentGradient)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="40" cy="80" r="8" fill="url(#accentGradient)"/>
      <circle cx="80" cy="0" r="8" fill="url(#accentGradient)"/>
      <circle cx="40" cy="40" r="6" fill="#22d3ee"/>
    </g>
    
    <!-- Title -->
    <text x="0" y="-60" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#textGradient)">
      Fistotex
    </text>
    
    <!-- Tagline -->
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="0.5px">
      Your Trusted Financial Companion
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="50" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#64748b">
      Expert News • Powerful Calculators • Smart Money Tools
    </text>
    
    <!-- Features badges -->
    <g transform="translate(-180, 110)">
      <rect x="0" y="0" width="120" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="60" y="27" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">14+ Calculators</text>
    </g>
    
    <g transform="translate(-10, 110)">
      <rect x="0" y="0" width="100" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="27" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Live News</text>
    </g>
    
    <g transform="translate(110, 110)">
      <rect x="0" y="0" width="100" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="27" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">India Focused</text>
    </g>
    
    <!-- Website URL -->
    <text x="0" y="190" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#475569">
      www.fistotex.com
    </text>
  </g>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#accentGradient)" opacity="0.3"/>
</svg>